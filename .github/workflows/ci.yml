name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        # `stable` re-runs the checks against the channel the template follows
        # (itera's nixpkgs overridden to it), so a 26.05 regression is caught.
        channel: [unstable, stable]
        exclude:
          - system: aarch64-linux
            channel: stable
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      # x86_64 runners ship /dev/kvm but not accessible by default; this udev
      # rule opens it so the Nix installer picks up the `kvm` system feature.
      # Skipped on aarch64 runners, which have no KVM device at all (the
      # udevadm trigger would fail) — VM tests are gated to x86_64 in
      # flake/checks.nix.
      - name: Enable KVM
        if: matrix.system == 'x86_64-linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate (the action's default since v21) —
          # it's what a NixOS host actually runs.
          determinate: false
          # Match itera's own `itera.nix.cache` defaults so CI pulls the same
          # prebuilt closures a consumer system would (the module only affects
          # built systems, not `nix flake check`, so configure the daemon here).
          # NOTE: keep this substituter + key in sync with the canonical defaults
          # in modules/nixos/core/cache.nix.
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # No /nix cache between runs: a restored store kept coming back with DB
      # entries for paths missing on disk (failing eval, then `nix-store
      # --verify` itself on FK constraints), and nearly everything it held is
      # substitutable from cache.nixos.org / nix-community anyway.

      # Runs everything: treefmt `formatting`, git-hooks `pre-commit`, and the
      # itera module tests for this system.
      - name: Flake check
        run: >-
          nix flake check --print-build-logs --system ${{ matrix.system }}
          ${{ matrix.channel == 'stable' && '--no-write-lock-file --override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05' || '' }}
